<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine? 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #ff758c, #ff7eb3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      width: 320px;
      position: relative;
    }

    h1 {
      color: #ff3b6f;
      margin-bottom: 8px;
    }

    p {
      color: #555;
      margin-bottom: 24px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 12px 26px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s ease, left 0.35s ease, top 0.35s ease;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    #yesBtn {
      background: #ff3b6f;
      color: white;
      top: 0;
    }

    #noBtn {
      background: #eee;
      color: #333;
      top: 60px;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>Hey Tvananya 💖</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons" id="btnArea">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 💔</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    /* ------------------ PREMIUM CONFETTI ------------------ */
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const pieces = [];
    const colors = ["#ff3b6f", "#ff85a1", "#ffd6e0", "#ffffff"];

    function heartPath(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x - size, y - size, x - size * 2, y + size / 2, x, y + size * 2);
      ctx.bezierCurveTo(x + size * 2, y + size / 2, x + size, y - size, x, y);
      ctx.closePath();
    }

    function createConfetti() {
      for (let i = 0; i < 180; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height,
          size: Math.random() * 6 + 6,
          speed: Math.random() * 2 + 2,
          rotation: Math.random() * 360,
          rotationSpeed: Math.random() * 4 - 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          type: Math.random() > 0.6 ? "heart" : "rect",
          opacity: 1
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pieces.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;

        if (p.type === "heart") {
          heartPath(0, 0, p.size);
          ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size, p.size, p.size * 1.6);
        }

        ctx.restore();

        p.y += p.speed;
        p.rotation += p.rotationSpeed;
        p.opacity -= 0.002;
      });
    }

    function animateConfetti() {
      drawConfetti();
      if (pieces.some(p => p.opacity > 0)) {
        requestAnimationFrame(animateConfetti);
      }
    }

    function startConfetti() {
      createConfetti();
      animateConfetti();
    }

    /* ------------------ NO BUTTON LOGIC ------------------ */
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const area = document.getElementById("btnArea");

    const texts = [
      "Are you sure? 🤨",
      "Think again 😏",
      "Really? 🥺",
      "Last chance 😳",
      "Don’t do this 💔",
      "You’ll regret this 😬",
      "Still no? 😶",
      "Come onnn 😩",
      "Okay… final time 😔"
    ];

    let noCount = 0;

    noBtn.addEventListener("click", () => {
      noCount++;

      if (noCount >= texts.length) {
        noBtn.innerText = "Yes ❤️";
        noBtn.style.top = "0";
        noBtn.onclick = () => yesBtn.click();
        return;
      }

      noBtn.innerText = texts[noCount];

      const areaRect = area.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = areaRect.width - btnRect.width;
      const maxY = areaRect.height - btnRect.height;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      document.getElementById("card").innerHTML = `
        <h1>YAY 💘</h1>
        <p>Officially my Valentine ❤️<br>Best decision ever 😌</p>
      `;
      startConfetti();
    });
  </script>
<script>
  /* ---------- SAFE NO-BUTTON MOVEMENT ---------- */

  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const area = document.getElementById("btnArea");

  const texts = [
    "Are you sure? 🤨",
    "Think again 😏",
    "Really? 🥺",
    "Last chance 😳",
    "Don’t do this 💔",
    "You’ll regret this 😬",
    "Still no? 😶",
    "Come onnn 😩",
    "Okay… final time 😔"
  ];

  let noCount = 0;

  function isOverlapping(rect1, rect2) {
    return !(
      rect1.right < rect2.left ||
      rect1.left > rect2.right ||
      rect1.bottom < rect2.top ||
      rect1.top > rect2.bottom
    );
  }

  noBtn.addEventListener("click", () => {
    noCount++;

    if (noCount >= texts.length) {
      noBtn.innerText = "Yes ❤️";
      noBtn.style.top = "0";
      noBtn.style.left = "50%";
      noBtn.style.transform = "translateX(-50%)";
      noBtn.onclick = () => yesBtn.click();
      return;
    }

    noBtn.innerText = texts[noCount];

    const areaRect = area.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();

    let x, y, attempts = 0;

    do {
      const btnRect = noBtn.getBoundingClientRect();
      x = Math.random() * (areaRect.width - btnRect.width);
      y = Math.random() * (areaRect.height - btnRect.height);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      attempts++;
    } while (
      isOverlapping(noBtn.getBoundingClientRect(), yesRect) &&
      attempts < 20
    );
  });

  /* ---------- YES BUTTON ---------- */

  yesBtn.addEventListener("click", () => {
    document.getElementById("card").innerHTML = `
      <h1>YAY 💘</h1>
      <p>Officially my Valentine ❤️<br>Best decision ever 😌</p>
    `;
    startConfetti();
  });
</script>
</body>
</html>
