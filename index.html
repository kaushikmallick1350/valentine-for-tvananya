<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine, Tono?</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 30px 20px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart {
      font-size: 60px;
      animation: beat 1.2s infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    h1 {
      margin: 10px 0 5px;
      color: #ff4d6d;
      font-size: 28px;
    }

    p {
      margin: 5px 0 20px;
      color: #444;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
    }

    button {
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: #fff;
      box-shadow: 0 6px 15px rgba(255,77,109,0.4);
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background: #ffe3ea;
      color: #ff4d6d;
      position: relative;
    }

    .message {
      margin-top: 20px;
      font-size: 20px;
      color: #ff4d6d;
      display: none;
      animation: fadeIn 1s ease;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Tono❤️</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons">
      <button id="yesBtn">Yes ✨</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="message" id="message">
      Yayyy!!!💖  
      You just made my life❤️
    </div>
  </div>

  <!-- Audio plays ONLY after clicking Yes -->
  <audio id="loveAudio" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_4c5f2d1c8f.mp3" type="audio/mpeg">
  </audio>

  <script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const card = document.querySelector(".card");
  const audio = document.getElementById("loveAudio");

  yesBtn.addEventListener("click", () => {
    // disable buttons
    yesBtn.style.display = "none";
    noBtn.style.display = "none";

    // fade out card
    card.style.transition = "opacity 1s ease, transform 1s ease";
    card.style.opacity = "0";
    card.style.transform = "scale(0.95)";

    // play music after interaction
    audio.volume = 0.6;
    audio.play();

    // after fade, show romantic scene
    setTimeout(() => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          background: radial-gradient(circle at top, #ffd1dc, #ff8fab);
          color:#fff;
          text-align:center;
          animation: fadeIn 2s ease;
          font-family: 'Poppins', system-ui, sans-serif;
        ">
          <div style="font-size:80px; animation: pulse 1.5s infinite;">❤️</div>
          <div style="font-size:22px; margin-top:20px; opacity:0; animation: appear 2s ease forwards 1s;">
            Yayyy… 💕
          </div>
          <div style="font-size:18px; margin-top:12px; opacity:0; animation: appear 2s ease forwards 2.5s;">
            Some moments don’t need to be explained.
          </div>
          <div style="font-size:18px; margin-top:8px; opacity:0; animation: appear 2s ease forwards 4s;">
            This is one of them.
          </div>
          <div style="font-size:20px; margin-top:30px; opacity:0; animation: appear 2s ease forwards 5.5s;">
            Tvananya ❤️
          </div>
        </div>

        <style>
          @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
          }
          @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
          }
          @keyframes appear {
            to { opacity: 1; }
          }
        </style>
      `;
    }, 1200);
  });
</script>

</body>
</html>
