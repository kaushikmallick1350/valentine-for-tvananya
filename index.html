<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Will You Be My Valentine? 💘</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #ff6f91, #ffb3c6);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 32px;
    border-radius: 24px;
    text-align: center;
    width: 330px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
  }

  h1 { color: #ff3b6f; margin-bottom: 8px; }
  p { color: #555; margin-bottom: 24px; }

  .buttons {
    position: relative;
    height: 140px;
  }

  button {
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    position: absolute;
    transition: all 0.35s ease;
    white-space: nowrap;
  }

  #yesBtn {
    background: #ff3b6f;
    color: white;
    left: 50%;
    top: 0;
    transform: translateX(-50%) scale(1.12);
    animation: heartbeat 1.8s infinite;
    padding: 14px 32px;
    font-size: 17px;
  }

  @keyframes heartbeat {
    0%, 100% {
      transform: translateX(-50%) scale(1.12);
    }
    50% {
      transform: translateX(-50%) scale(1.22);
    }
  }

  #noBtn {
    background: #eee;
    color: #333;
    left: 50%;
    top: 70px;
    transform: translateX(-50%);
  }

  #noBtn:hover {
    animation: wiggle 0.4s ease-in-out infinite;
  }

  @keyframes wiggle {
    0% { transform: translateX(-50%) rotate(0deg); }
    25% { transform: translateX(-50%) rotate(-4deg); }
    50% { transform: translateX(-50%) rotate(4deg); }
    100% { transform: translateX(-50%) rotate(0deg); }
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Hey Tvananya 💖</h1>
  <p>Will you be my Valentine?</p>

  <div class="buttons" id="btnArea">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<audio id="bgMusic" src="https://assets.mixkit.co/music/preview/mixkit-soft-romantic-piano-208.mp3" loop></audio>
<audio id="cheer" src="https://assets.mixkit.co/sfx/preview/mixkit-small-crowd-cheer-364.mp3"></audio>

<script>
/* ================= CONFETTI SYSTEM ================= */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];
const colors = ["#ff3b6f", "#ff85a1", "#ffd6e0", "#ffffff"];

function createParticle(x, y, power = 1) {
  return {
    x,
    y,
    vx: (Math.random() - 0.5) * 14 * power,
    vy: (Math.random() - 1.3) * 14 * power,
    size: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    life: 1,
    rotation: Math.random() * 360,
    rotationSpeed: (Math.random() - 0.5) * 10
  };
}

function heroBurst() {
  const card = document.getElementById("card").getBoundingClientRect();
  for (let i = 0; i < 320; i++) {
    particles.push(
      createParticle(
        card.left + card.width / 2,
        card.top + card.height / 2,
        1.3
      )
    );
  }
}

function backgroundBurst() {
  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height * 0.6;
  for (let i = 0; i < 90; i++) {
    particles.push(createParticle(x, y, 0.7));
  }
}

let animationRunning = false;

function animateConfetti() {
  if (!animationRunning) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.28;
    p.rotation += p.rotationSpeed;
    p.life -= 0.012;
  });

  particles = particles.filter(p => p.life > 0);

  if (particles.length > 0) {
    requestAnimationFrame(animateConfetti);
  } else {
    animationRunning = false;
  }
}

function startConfetti() {
  animationRunning = true;
  heroBurst();
  animateConfetti();

  let count = 0;
  const interval = setInterval(() => {
    backgroundBurst();
    if (++count > 10) clearInterval(interval);
  }, 500);
}

/* ================= BUTTON LOGIC ================= */
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const area = document.getElementById("btnArea");

const messages = [
  "Are you sure? 🤨",
  "Think again 😏",
  "Really? 🥺",
  "Last chance 😳",
  "Don’t do this 💔",
  "Still no? 😶",
  "Come onnn 😩",
  "Okay… final time 😔"
];

let count = 0;
let scale = 1;

function overlaps(r1, r2) {
  return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
}

noBtn.addEventListener("click", () => {
  count++;
  scale = Math.max(0.75, scale - 0.04);
  noBtn.style.transform = `scale(${scale})`;

  if (count >= messages.length) {
    noBtn.innerText = "Yes ❤️";
    noBtn.onclick = () => yesBtn.click();
    return;
  }

  noBtn.innerText = messages[count];

  const areaRect = area.getBoundingClientRect();
  const yesRect = yesBtn.getBoundingClientRect();

  let x, y, tries = 0;
  do {
    x = Math.random() * (areaRect.width - noBtn.offsetWidth);
    y = Math.random() * (areaRect.height - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    tries++;
  } while (overlaps(noBtn.getBoundingClientRect(), yesRect) && tries < 15);
});

/* ================= YES CLICK ================= */
yesBtn.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
  document.getElementById("cheer").play();
  startConfetti();

  document.getElementById("card").innerHTML = `
    <h1>I love you❤️</h1>
    <p>
      Officially my valentine🧿<br><br>
      Can we go out tomorrow?😊
    </p>
  `;
});
</script>

</body>
</html>
